[project]
name = "reponary"
version = "0.1.0"
description = "Local-first code intelligence and Markdown engineering knowledge"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.30,<1",
  "Markdown>=3.8,<4",
  "bleach>=6,<7",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
